<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/style.css"><title>Agent Teleporter</title></head><body><header><strong>Agent Teleporter</strong><span id="status">Disconnected</span></header><section id="login"><label>Access token <input id="token" type="password" autocomplete="off" placeholder="Worker REMOTE_TOKEN"></label><button id="connect">Connect</button></section><nav><select id="host" aria-label="Host"></select><select id="session" aria-label="Session"></select><select id="harness"><option value="pi">Pi</option><option value="claude">Claude Code</option></select><button id="create">New session</button><button id="pair">Pair Android</button></nav><section id="pairing" hidden><strong>Pair Android</strong><button id="close-pair">Close</button><p>1. WireGuard QR: WireGuard アプリで読み込み、VPN を ON にしてください。</p><div id="wg-qr"></div><p>2. Connection QR: Android アプリの Scan QR、またはブラウザのカメラで読み込みます。</p><div id="url-qr"></div><p>QR には秘密鍵・操作トークンが含まれます。第三者に見せないでください。</p></section><main id="terminal"></main><aside><button data-key="\u001b">Esc</button><button data-key="\u0003">Ctrl-C</button><button data-key="\t">Tab</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\r">Enter</button></aside><section id="messages"><label>Send to session <select id="target"></select></label><input id="message" maxlength="4096" placeholder="Message to another harness"><button id="send">Send</button><div id="log" role="log" aria-live="polite"></div></section><script src="/app.js" defer></script></body></html>
